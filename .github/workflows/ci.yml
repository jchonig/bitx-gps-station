name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build package
        run: make deb
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
