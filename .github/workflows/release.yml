name: Release

# Push a tag vX.Y.Z matching the top entry of debian/changelog. This lints,
# tests and builds the .deb, attaches it to a GitHub Release, and publishes
# the signed apt repository to GitHub Pages.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against debian/changelog
        run: |
          version=$(make -s version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but debian/changelog says $version"
            exit 1
          fi
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build package
        run: make deb
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.deb
          --title "$GITHUB_REF_NAME" --generate-notes
      - name: Build apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::APT_SIGNING_KEY secret is not set"
            exit 1
          fi
          make repo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
